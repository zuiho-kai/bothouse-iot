# bothouse-iot 设备服务配置示例。复制成 config.toml 再改（config.toml 不进仓库）。
# 接线说明见 docs/wiring.md；出门用见 docs/remote.md。网页表盘：http://<设备服务>:8791/dial

[device]                       # 板子连的设备服务（小智协议：OTA + WebSocket）
listen = "0.0.0.0"
port = 8791                    # 板子的 OTA 地址 = http://<本机局域网 IP>:8791/xiaozhi/ota/
public_url = ""                # 经反向代理从外网连时填对外地址，如 "https://example.com/iot"；局域网留空
remote = false                 # true：出门也能用，板子经云端转发连回来（docs/remote.md）；要写 public_url，require_key 默认跟着打开
token = ""                     # 没配 key 的板子共用的 token（局域网可留空）；也可用环境变量 BOTHOUSE_IOT_TOKEN
# require_key = false          # true：只放行配了 key 的板子；不写时跟 remote 一样
firmware = ""                  # 可选：编好的 xiaozhi.bin，板子连上时按 elf_sha256 比较，不一样就让它 Wi-Fi 升级
# firmware_release = "zuiho-kai/bothouse-iot"   # 可选（和 firmware 二选一）：从这个仓最新 Release 取固件，每 6 小时查一次
# firmware_asset = "xiaozhi-spotpear-sp-esp32-s3-1.28-box.bin"   # Release 里的哪个文件（默认这个板型）
data_dir = "data"

[bothouse]                     # bothouse 的外部适配器接口（config.toml 里 [bridge] enabled = true）
url = "ws://127.0.0.1:9810/bridge/ws"
token = ""                     # 同 bothouse [bridge] token；建议用环境变量 BOTHOUSE_BRIDGE_TOKEN
platform = "iot"               # 注册的平台名，session key = iot:<角色>:<板子>

[speech]
# 默认两样都交给 bothouse；bothouse 没配时自动退到下面的本机命令，所以没有语音服务也能先跑起来。
# 板子说的话怎么转文字：
#   "bothouse" = 把语音交给 bothouse，用它的 [speech] 转写；bothouse 回「语音未启用」时改用 stt_command
#   "command"  = 只用本机命令转写，{in} 是一句话的 WAV（16k 单声道），文字打印到标准输出
stt = "bothouse"
# stt_command = ["whisper-cli", "-m", "ggml-small.bin", "-l", "zh", "-nt", "-f", "{in}"]

# bot 的回话怎么变成声音：
#   "bothouse" = 用 bothouse [tts]（tts_mode = "always"）发来的音频，文字当字幕；20 秒等不到就改用 tts_command
#   "command"  = 只用本机命令合成，{text} 是要念的话，音频写到 {out}（ffmpeg 读得懂的格式即可）
# tts_command 不写时用本机自带的：macOS say，Linux espeak-ng / espeak。
tts = "bothouse"
# tts_command = ["say", "-o", "{out}", "{text}"]          # macOS 自带

# 设备绑定：一块板绑一个角色，一个角色对应一个 bothouse 项目。所有绑定只写在这里。
# device 是板子 MAC（服务日志里会打出没绑定的板子的 MAC）。
[[boards]]
device = "aa:bb:cc:dd:ee:01"   # 示例 MAC，换成你的板子
role = "ju"                    # 角色 id（表盘、日志、session key 用）
name = "橘"                    # 表盘上显示的名字
project = "my-project"         # bothouse 里这个角色的项目名
color = "#f0a020"
avatar = "avatars/ju.jpg"      # 相对本文件；表盘头像
# avatar_thinking = "avatars/ju-thinking.jpg"
skins = "skins/ju"             # 会动的表盘：皮肤目录（仓里自带橘的两款：standard 标准、pastel 油画棒），见 docs/dial-skins.md
skin = "pastel"                # 默认皮肤；网页 /dial?skin=standard 可以临时换着看
# key = ""                     # 这块板自己的钥匙（可选）；用 tools/board-nvs.py --ws-token-gen 生成并写进板子
